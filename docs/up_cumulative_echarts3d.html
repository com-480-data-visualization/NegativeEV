  <script>
    const PAYLOAD = JSON.parse(document.getElementById('surface-data').textContent);
    const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
    let currentMode = 'realized';

    function fmtPct(x) {
      const sign = x >= 0 ? '+' : '';
      return sign + Number(x).toFixed(2) + '%';
    }
    function fmt4(x) {
      return Number(x).toFixed(4);
    }
    function fmtSigned4(x) {
      const sign = x >= 0 ? '+' : '';
      return sign + Number(x).toFixed(4);
    }
    function fmtInt(x) {
      return Math.round(Number(x)).toLocaleString();
    }

    function colorsFor(ds) {
      if (ds.palette === 'gap') {
        // blue (under-pricing) → deep violet (neutral) → red (over-pricing) — no white so structure is visible
        return ['#1d4ed8', '#7c3aed', '#dc2626'];
      }
      // red (P=0) → amber → green (P=1): traffic-light for cumulative UP probability
      return ['#dc2626', '#f59e0b', '#16a34a'];
    }

    function tooltipFormatter(params) {
      const v = params.value;
      // [time, y_upper, zSurface, realized, implied, gap, cumUpCount, cumAllCount, cumImplCount]
      const time    = v[0];
      const yUpper  = v[1];
      const realized = v[3];
      const implied  = v[4];
      const gap      = v[5];
      const cumUp    = v[6];   // cumulative UP markets with BTC Δ ≤ yUpper
      const cumAll   = v[7];   // cumulative all markets with BTC Δ ≤ yUpper
      const cumImpl  = v[8];   // cumulative quoted rows with BTC Δ ≤ yUpper
      const totalUp  = PAYLOAD.meta.totalUp;
      const bw       = PAYLOAD.meta.bucketWidth;
      const yLower   = yUpper - bw;

      const bucketLabel = `]${fmtPct(yLower)}, ${fmtPct(yUpper)}]`;

      const bold = (s) => `<b>${s}</b>`;
      const r = currentMode === 'realized';
      const i = currentMode === 'implied';
      const g = currentMode === 'gap';

      return `
        <div style="min-width:290px;line-height:1.6">
          <div>Time elapsed: <b>${time} s</b></div>
          <div>Bucket: <b>${bucketLabel}</b></div>
          <hr style="border:none;border-top:1px solid #475569;margin:5px 0" />
          <div>Realized: ${r ? bold(fmt4(realized)) : fmt4(realized)}</div>
          <div>Implied: ${i ? bold(fmt4(implied)) : fmt4(implied)}</div>
          <div>Gap (impl − realized): ${g ? bold(fmtSigned4(gap)) : fmtSigned4(gap)}</div>
          <hr style="border:none;border-top:1px solid #475569;margin:5px 0" />
          <div>Cumul. UP markets (≤ bucket): ${fmtInt(cumUp)} / ${fmtInt(totalUp)}</div>
          <div>Cumul. all markets (≤ bucket): ${fmtInt(cumAll)}</div>
          <div>Cumul. quoted rows: ${fmtInt(cumImpl)}</div>
        </div>
      `;
    }

    function makeOption(mode) {
      const ds = PAYLOAD.datasets[mode];
      const colors = colorsFor(ds);
      const titleText = ds.title;
      const subtitleText = `${ds.subtitle} · implied universe: ${PAYLOAD.meta.impliedUniverse}`;
      document.getElementById('title').textContent = titleText;
      document.getElementById('subtitle').textContent = subtitleText;

      const isGap = mode === 'gap';
      return {
        backgroundColor: '#0f172a',
        animation: false,
        tooltip: {
          show: true,
          trigger: 'item',
          confine: true,
          backgroundColor: 'rgba(15, 23, 42, 0.96)',
          borderColor: '#475569',
          textStyle: { color: '#e5e7eb', fontSize: 12 },
          formatter: tooltipFormatter,
        },
        visualMap: {
          show: true,
          calculable: true,
          realtime: false,
          dimension: 2,
          min: ds.visualMin,
          max: ds.visualMax,
          precision: 3,
          text: [String(ds.visualMax), String(ds.visualMin)],
          textStyle: { color: '#e5e7eb' },
          inRange: { color: colors },
          orient: 'vertical',
          right: 18,
          top: 86,
        },
        xAxis3D: {
          type: 'value',
          name: 'Time elapsed (s)',
          min: PAYLOAD.meta.timeMin,
          max: PAYLOAD.meta.timeMax,
          inverse: true,
          nameTextStyle: { color: '#e5e7eb' },
          axisLabel: { color: '#cbd5e1' },
          axisLine: { lineStyle: { color: '#94a3b8' } },
          splitLine: { lineStyle: { color: '#334155' } },
        },
        yAxis3D: {
          type: 'value',
          name: 'BTC Δ threshold (%)',
          min: PAYLOAD.meta.yMin,
          max: PAYLOAD.meta.yMax,
          nameTextStyle: { color: '#e5e7eb' },
          axisLabel: {
            color: '#cbd5e1',
            formatter: function(value) { return fmtPct(value); }
          },
          axisLine: { lineStyle: { color: '#94a3b8' } },
          splitLine: { lineStyle: { color: '#334155' } },
        },
        zAxis3D: {
          type: 'value',
          name: ds.zName,
          min: ds.zMin,
          max: ds.zMax,
          nameTextStyle: { color: '#e5e7eb' },
          axisLabel: { color: '#cbd5e1' },
          axisLine: { lineStyle: { color: '#94a3b8' } },
          splitLine: { lineStyle: { color: '#334155' } },
        },
        grid3D: {
          boxWidth: 160,
          boxDepth: 100,
          boxHeight: isGap ? 78 : 90,
          environment: '#0f172a',
          axisPointer: { show: true },
          viewControl: {
            projection: 'perspective',
            autoRotate: false,
            alpha: 26,
            beta: -42,
            distance: 220,
            minDistance: 80,
            maxDistance: 420,
          },
          light: {
            main: { intensity: 1.2, shadow: false },
            ambient: { intensity: 0.55 },
          },
          postEffect: { enable: false },
          temporalSuperSampling: { enable: false },
        },
        series: [{
          type: 'surface',
          name: ds.zName,
          data: ds.data,
          shading: 'lambert',
          wireframe: { show: false },
          itemStyle: { opacity: 0.97 },
          silent: false,
        }]
      };
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('button[data-mode]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      chart.setOption(makeOption(mode), true);
    }

    document.querySelectorAll('button[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    window.addEventListener('resize', () => chart.resize());
    setMode(currentMode);
  </script>
</body>
</html>
